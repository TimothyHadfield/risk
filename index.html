<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1117">
<title>Risk — Timothy Hadfield</title>
<meta name="description" content="Play Risk against measured computer players, with exact battle odds on every attack and a real-table odds calculator.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=1">
<link rel="stylesheet" href="css/style.css?v=8">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M8 11c3 1 4-2 7-1s2 4 5 4 3-3 5-2M7 19c3-1 5 2 8 1s4-3 7-1" fill="none" stroke="#e5534b" stroke-width="2.2" stroke-linecap="round"/></svg><span>Risk</span></div>
    <nav class="tabs-top" id="tabsTop" aria-label="Sections"></nav>
    <span class="ver" id="ver"></span>
  </header>
  <main id="main" class="tbl-surface tbl-wood-dark">
    <section class="seats" id="seats" aria-label="Other players" hidden></section>
    <section class="map-col"><div class="map-wrap" id="mapWrap"><svg id="map" role="img" aria-label="World map"></svg></div>
      <div class="zoom-bar"><button class="zoom fit" id="fitBtn" aria-label="Fit whole board" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="zoom" id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button><button class="zoom" id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    </section>
    <section class="panel-col" id="panel"></section>
    <section class="mine" id="mine" aria-label="Your place at the table" hidden></section>
  </main>
  <nav class="tabs-bottom" id="tabsBottom" aria-label="Sections"></nav>
</div>
<div class="sheet-back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="js/map.js?v=1"></script>
<script src="js/geo.js?v=2"></script>
<script src="js/odds.js?v=2"></script>
<script src="js/engine.js?v=2"></script>
<script src="js/ai.js?v=2"></script>
<script src="js/strength.js?v=1"></script>
<script src="js/mapview.js?v=5"></script>
<script src="js/fx.js?v=2"></script>
<script src="js/table.js?v=1"></script>
<script src="js/fxrisk.js?v=2"></script>
<script src="js/adapter.js?v=1"></script>
<script src="js/app.js?v=9"></script>
<script type="module" src="js/net.js?v=1"></script>
</body>
</html>
